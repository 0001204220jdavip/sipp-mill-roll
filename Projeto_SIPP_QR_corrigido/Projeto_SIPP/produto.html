<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta do Rolo | Mill Roll</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 22px 12px 35px; background: #f2f5f7; color: #333; font-family: Arial, Helvetica, sans-serif; }
        .topo { max-width: 760px; margin: 0 auto 18px; padding: 17px; background: #fff; border-radius: 9px; border-bottom: 5px solid #1688b9; text-align: center; box-shadow: 0 3px 14px rgba(0,0,0,.08); }
        .logo { width: 280px; max-width: 90%; height: auto; }
        .topo p { margin: 7px 0 0; color: #555; font-size: 13px; }
        .container { max-width: 760px; margin: 0 auto; padding: 25px; background: #fff; border-radius: 9px; box-shadow: 0 3px 18px rgba(0,0,0,.09); }
        h1 { margin: 0 0 7px; color: #147eac; font-size: 24px; }
        .subtitulo { margin: 0 0 22px; color: #687078; }
        .codigo { margin-bottom: 18px; padding: 14px; background: #fff9d9; border-left: 5px solid #f0d500; border-radius: 5px; }
        .codigo strong { color: #176f94; font-size: 17px; }
        .linha { padding: 12px 0; border-bottom: 1px solid #e5e9ec; line-height: 1.45; overflow-wrap: anywhere; }
        .linha strong { display: block; margin-bottom: 4px; color: #176f94; font-size: 13px; }
        .rodape { margin-top: 23px; color: #7a8287; font-size: 12px; text-align: center; }
        .erro { padding: 15px; background: #fff1f0; border-left: 5px solid #b42318; border-radius: 5px; color: #7a271a; line-height: 1.5; }
        a { display: inline-block; margin-top: 18px; color: #147eac; font-weight: bold; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 600px) { .container { padding: 18px; } }
    </style>
</head>
<body>
    <header class="topo">
        <img class="logo" src="logo-mill-roll.png" alt="Mill Roll - Rolos Industriais">
        <p>Sistema de Identificação e Acompanhamento de Rolos Industriais</p>
    </header>

    <main class="container">
        <h1>Consulta do Produto</h1>
        <p class="subtitulo">Informações de identificação do rolo industrial</p>
        <div id="resultado"></div>
        <p class="rodape">Mill Roll | Consulta gerada a partir das informações guardadas no QR Code.</p>
    </main>

    <script>
        // Le os dados que foram colocados dentro do QR Code.
        function mostrarProduto() {
            const resultado = document.getElementById('resultado');
            const endereco = window.location.hash;

            if (endereco.indexOf('#dados=') !== 0) {
                resultado.innerHTML = '<div class="erro">Nao foram encontrados dados neste QR Code. Abra esta pagina escaneando a etiqueta do produto.</div><a href="index.html">Voltar ao cadastro</a>';
                return;
            }

            try {
                const texto = endereco.substring(7);
                const campos = texto.split('|').map(function (campo) {
                    return decodeURIComponent(campo);
                });

                if (campos.length < 10) {
                    throw new Error('Dados incompletos');
                }

                const rolo = {
                    id: campos[0],
                    codigo: campos[1],
                    cliente: campos[2],
                    produto: campos[3],
                    pedido: campos[4],
                    servico: campos[5],
                    situacao: campos[6],
                    localizacao: campos[7],
                    entrada: campos[8],
                    atualizacao: campos[9]
                };

                const codigo = document.createElement('div');
                codigo.className = 'codigo';
                codigo.innerHTML = '<strong>Codigo de Patrimonio</strong><br>';
                const valorCodigo = document.createElement('span');
                valorCodigo.textContent = rolo.codigo;
                codigo.appendChild(valorCodigo);
                resultado.appendChild(codigo);

                const informacoes = [
                    ['Cliente', rolo.cliente],
                    ['Tipo de Produto', rolo.produto],
                    ['Numero do Pedido', rolo.pedido],
                    ['Servico Solicitado', rolo.servico],
                    ['Situacao Atual na Etiqueta', rolo.situacao],
                    ['Localizacao', rolo.localizacao],
                    ['Data de Entrada', rolo.entrada],
                    ['Ultima Atualizacao da Etiqueta', rolo.atualizacao]
                ];

                informacoes.forEach(function (informacao) {
                    const linha = document.createElement('div');
                    linha.className = 'linha';
                    const nome = document.createElement('strong');
                    nome.textContent = informacao[0];
                    const valor = document.createElement('span');
                    valor.textContent = informacao[1];
                    linha.appendChild(nome);
                    linha.appendChild(valor);
                    resultado.appendChild(linha);
                });
            } catch (erro) {
                resultado.innerHTML = '<div class="erro">Nao foi possivel ler as informacoes desta etiqueta. Gere um novo QR Code pelo sistema.</div>';
            }
        }

        mostrarProduto();
    </script>
</body>
</html>
